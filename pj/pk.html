<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizGen AI – Quiz Generator Chatbot</title>
    <style>
        :root {
            --bg-primary: #080D1A;
            --bg-secondary: #101827;
            --bg-card: #172033;
            --bg-card-hover: #1e2a42;
            --bg-glass: rgba(23, 32, 51, 0.8);
            --bg-glass-light: rgba(255, 255, 255, 0.04);
            --bg-input: #0f1625;
            --primary: #6366F1;
            --primary-hover: #7c7ff5;
            --secondary: #8B5CF6;
            --secondary-hover: #9d70f8;
            --accent: #06B6D4;
            --accent-hover: #0ac6e4;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
            --text-primary: #F8FAFC;
            --text-secondary: #cbd5e1;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glass: rgba(255, 255, 255, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-full: 50px;
            --transition-fast: 0.15s ease;
            --transition-med: 0.3s ease;
            --transition-slow: 0.5s ease;
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            --sidebar-width: 270px;
            --header-height: 64px;
            --input-height: 60px;
            --scrollbar-width: 6px;
            --quiz-max-width: 800px;
        }

        [data-theme="light"] {
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-glass-light: rgba(0, 0, 0, 0.03);
            --bg-input: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
            --border-glass: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background var(--transition-med), color var(--transition-med);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar {
            width: var(--scrollbar-width);
            height: var(--scrollbar-width);
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform var(--transition-med), width var(--transition-med);
            z-index: 100;
            position: relative;
            overflow: hidden;
        }
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(99, 102, 241, 0.04) 0%, transparent 40%);
            pointer-events: none;
        }
        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border-glass);
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .sidebar-logo .logo-icon {
            font-size: 1.6rem;
        }
        .sidebar-logo .logo-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sidebar-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            padding-left: 36px;
            letter-spacing: 0.3px;
        }
        .sidebar-actions {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-glass);
            flex-shrink: 0;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .btn-new-quiz {
            width: 100%;
            padding: 10px 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all var(--transition-fast);
            letter-spacing: 0.2px;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
            font-family: inherit;
        }
        .btn-new-quiz:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.45);
            background: linear-gradient(135deg, var(--primary-hover), var(--secondary-hover));
        }
        .sidebar-nav {
            padding: 4px 8px;
            position: relative;
            z-index: 2;
        }
        .sidebar-nav-btn {
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.82rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            text-align: left;
            font-family: inherit;
            margin-bottom: 2px;
        }
        .sidebar-nav-btn:hover {
            background: var(--bg-glass-light);
            color: var(--text-primary);
        }
        .sidebar-nav-btn.active {
            background: var(--bg-glass-light);
            border-left: 3px solid var(--primary);
            color: var(--text-primary);
        }
        .sidebar-history {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            min-height: 0;
            position: relative;
            z-index: 2;
        }
        .history-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 10px 0 4px;
            font-weight: 600;
        }
        .history-item {
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition-fast);
            margin-bottom: 2px;
            word-break: break-word;
        }
        .history-item:hover {
            background: var(--bg-glass-light);
            color: var(--text-primary);
        }
        .history-item .history-icon {
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .history-item .history-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.78rem;
        }
        .history-item .history-delete {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity var(--transition-fast);
            flex-shrink: 0;
            padding: 2px 4px;
            border-radius: 4px;
            border: none;
            background: transparent;
        }
        .history-item:hover .history-delete {
            opacity: 1;
        }
        .history-item .history-delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }
        .sidebar-footer {
            padding: 10px 14px;
            border-top: 1px solid var(--border-glass);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            z-index: 2;
        }
        .sidebar-footer-btn {
            padding: 7px 10px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
            text-align: left;
            font-family: inherit;
        }
        .sidebar-footer-btn:hover {
            background: var(--bg-glass-light);
            color: var(--text-primary);
        }
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(251, 146, 60, 0.15);
            border: 1px solid rgba(251, 146, 60, 0.3);
            border-radius: var(--radius-full);
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #fb923c;
            margin: 4px 8px;
        }

        /* MAIN CHAT AREA */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            position: relative;
            background: var(--bg-primary);
        }
        .chat-header {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
            z-index: 10;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .hamburger-btn {
            display: none;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-glass-light);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            cursor: pointer;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all var(--transition-fast);
            flex-shrink: 0;
            font-family: inherit;
        }
        .hamburger-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .chat-header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }
        .chat-header-subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            display: inline-block;
            animation: statusPulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes statusPulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
            }
            50% {
                box-shadow: 0 0 0 5px rgba(34, 197, 94, 0);
            }
        }
        .chat-header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--bg-glass-light);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: all var(--transition-fast);
            position: relative;
            font-family: inherit;
        }
        .btn-icon:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--border-color);
        }
        .btn-icon .tooltip {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 3px 8px;
            border-radius: 4px;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-fast);
            white-space: nowrap;
            z-index: 20;
        }
        .btn-icon:hover .tooltip {
            opacity: 1;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            min-height: 0;
        }

        /* WELCOME SCREEN */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            text-align: center;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .welcome-emoji {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .welcome-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .welcome-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            max-width: 480px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            max-width: 600px;
            width: 100%;
        }
        .quick-action-card {
            padding: 12px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            cursor: pointer;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: inherit;
        }
        .quick-action-card:hover {
            border-color: var(--primary);
            background: var(--bg-card-hover);
            color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .quick-action-card .qa-icon {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 3px;
        }

        /* CHAT MESSAGES */
        .message {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: fadeInUp 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.ai {
            align-self: flex-start;
        }
        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 2px;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-size: 0.7rem;
        }
        .message.ai .message-avatar {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            font-size: 0.9rem;
        }
        .message-bubble {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
            min-width: 50px;
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
        }
        .message.ai .message-bubble {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
        }
        .message-bubble h3 {
            font-size: 0.9rem;
            font-weight: 700;
            margin: 8px 0 4px;
            color: var(--primary);
        }
        .message-bubble h4 {
            font-size: 0.82rem;
            font-weight: 600;
            margin: 6px 0 2px;
            color: var(--text-primary);
        }
        .message-bubble ul,
        .message-bubble ol {
            padding-left: 18px;
            margin: 4px 0;
        }
        .message-bubble li {
            margin: 2px 0;
            font-size: 0.82rem;
        }
        .message-bubble code {
            background: rgba(99, 102, 241, 0.15);
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.78rem;
            font-family: 'Courier New', monospace;
        }
        .message-bubble strong {
            color: var(--primary);
        }
        .msg-timestamp {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 3px;
            opacity: 0.7;
        }

        /* TYPING INDICATOR */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        /* INPUT AREA */
        .input-area {
            padding: 10px 20px 14px;
            border-top: 1px solid var(--border-glass);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            flex-shrink: 0;
            z-index: 10;
        }
        .input-container {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 6px 10px;
            transition: all var(--transition-fast);
            position: relative;
        }
        .input-container:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }
        .input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: inherit;
            resize: none;
            line-height: 1.5;
            max-height: 100px;
            min-height: 26px;
            padding: 3px 0;
        }
        .input-container textarea::placeholder {
            color: var(--text-muted);
        }
        .input-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-glass-light);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all var(--transition-fast);
            flex-shrink: 0;
            font-family: inherit;
        }
        .input-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .input-btn.send-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            width: 36px;
            height: 36px;
            font-size: 1rem;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
        }
        .char-counter {
            font-size: 0.6rem;
            color: var(--text-muted);
            position: absolute;
            bottom: -14px;
            right: 4px;
            opacity: 0.7;
        }

        /* QUIZ INTERFACE */
        .quiz-interface {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 16px 24px;
            gap: 12px;
            overflow-y: auto;
            max-width: var(--quiz-max-width);
            margin: 0 auto;
            width: 100%;
        }
        .quiz-interface.active {
            display: flex;
        }
        .quiz-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .quiz-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .quiz-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .quiz-timer {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: var(--radius-sm);
            background: var(--bg-glass-light);
            border: 1px solid var(--border-glass);
        }
        .quiz-timer.low {
            color: var(--danger);
            animation: timerPulse 1s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .quiz-progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-glass-light);
            border-radius: 2px;
            overflow: hidden;
        }
        .quiz-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .question-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            animation: fadeInUp 0.3s ease;
            box-shadow: var(--shadow-sm);
        }
        .question-progress-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .question-text {
            font-size: 0.92rem;
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-btn {
            padding: 10px 14px;
            background: var(--bg-glass-light);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.82rem;
            transition: all var(--transition-fast);
            text-align: left;
            font-family: inherit;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .option-btn:hover {
            border-color: var(--primary);
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .option-btn.selected {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
            color: var(--text-primary);
            box-shadow: 0 0 0 1px var(--primary);
        }
        .option-btn.correct {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }
        .option-btn.wrong {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }
        .option-letter {
            font-weight: 700;
            font-size: 0.8rem;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg-glass-light);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .option-btn.selected .option-letter {
            background: var(--primary);
            color: #fff;
        }
        .option-btn.correct .option-letter {
            background: var(--success);
            color: #fff;
        }
        .option-btn.wrong .option-letter {
            background: var(--danger);
            color: #fff;
        }
        .quiz-nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all var(--transition-fast);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.45);
        }
        .btn-secondary {
            background: var(--bg-glass-light);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-glass);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }
        .btn-success {
            background: var(--success);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .question-navigator {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 6px 0;
        }
        .nav-dot {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
            background: var(--bg-glass-light);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        .nav-dot:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }
        .nav-dot.current {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }
        .nav-dot.answered {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }
        .nav-dot.review {
            background: var(--warning);
            color: #fff;
            border-color: var(--warning);
        }
        .nav-dot.answered-review {
            background: linear-gradient(135deg, var(--success), var(--warning));
            color: #fff;
            border-color: var(--warning);
        }

        .explanation-box {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            margin-top: 8px;
            font-size: 0.8rem;
            background: var(--bg-glass-light);
            border-left: 3px solid var(--primary);
        }
        .explanation-box.correct {
            border-left-color: var(--success);
            background: rgba(34, 197, 94, 0.08);
        }
        .explanation-box.wrong {
            border-left-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        /* RESULT SCREEN */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            gap: 14px;
            overflow-y: auto;
            max-width: var(--quiz-max-width);
            margin: 0 auto;
            width: 100%;
        }
        .result-screen.active {
            display: flex;
        }
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-md);
            animation: fadeInUp 0.5s ease;
        }
        .result-emoji {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        .result-score {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .result-percentage {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .result-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin: 14px 0;
            width: 100%;
        }
        .stat-item {
            background: var(--bg-glass-light);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .performance-label {
            font-size: 1rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: var(--radius-full);
            display: inline-block;
        }
        .performance-excellent {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        .performance-good {
            background: rgba(6, 182, 212, 0.2);
            color: var(--accent);
        }
        .performance-improve {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        .performance-keep {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .result-review {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .review-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px 16px;
        }
        .review-card.correct {
            border-left: 3px solid var(--success);
        }
        .review-card.wrong {
            border-left: 3px solid var(--danger);
        }
        .review-card.skipped {
            border-left: 3px solid var(--warning);
        }
        .review-question {
            font-size: 0.82rem;
            font-weight: 600;
        }
        .review-answer {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .review-answer .correct-text {
            color: var(--success);
        }
        .review-answer .wrong-text {
            color: var(--danger);
        }
        .result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* WEAK TOPICS */
        .weak-topics {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 14px;
        }
        .weak-topic-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.78rem;
            border-bottom: 1px solid var(--border-glass);
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            max-width: 480px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .modal-title {
            font-size: 1rem;
            font-weight: 700;
        }
        .modal-close {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: var(--bg-glass-light);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            font-family: inherit;
        }
        .modal-close:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-select,
        .form-input {
            padding: 8px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            transition: all var(--transition-fast);
        }
        .form-select:focus,
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        .form-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 14px;
        }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 300;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            font-size: 0.8rem;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast.success {
            border-left: 3px solid var(--success);
        }
        .toast.error {
            border-left: 3px solid var(--danger);
        }
        .toast.info {
            border-left: 3px solid var(--accent);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(30px);
            }
        }

        /* SIDEBAR OVERLAY */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .sidebar-overlay.active {
            display: block;
        }

        /* STATS DRAWER */
        .stats-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 90vw;
            height: 100%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-glass);
            z-index: 150;
            transition: right var(--transition-med);
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }
        .stats-drawer.open {
            right: 0;
        }
        .stats-drawer-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-drawer-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .stats-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px;
            text-align: center;
        }
        .stats-card-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stats-card-label {
            font-size: 0.68rem;
            color: var(--text-muted);
        }
        .subject-performance {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .subject-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
        }
        .subject-bar-label {
            width: 80px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }
        .subject-bar-track {
            flex: 1;
            height: 6px;
            background: var(--bg-glass-light);
            border-radius: 3px;
            overflow: hidden;
        }
        .subject-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.5s ease;
        }
        .subject-bar-percent {
            width: 40px;
            text-align: right;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar {
                width: 250px;
                min-width: 250px;
            }
            .message {
                max-width: 90%;
            }
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                width: 280px;
                min-width: 280px;
                z-index: 100;
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .hamburger-btn {
                display: flex;
            }
            .message {
                max-width: 95%;
            }
            .chat-header {
                padding: 0 12px;
                height: 56px;
            }
            .messages-container {
                padding: 12px;
            }
            .input-area {
                padding: 8px 12px 10px;
            }
            .chat-header-subtitle {
                display: none;
            }
            .chat-header-title {
                font-size: 0.88rem;
            }
            .quick-actions {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
                gap: 6px;
            }
            .quick-action-card {
                padding: 8px 6px;
                font-size: 0.65rem;
            }
            .welcome-title {
                font-size: 1.25rem;
            }
            .welcome-emoji {
                font-size: 2.2rem;
            }
            .quiz-interface {
                padding: 10px 12px;
            }
            .question-card {
                padding: 14px 16px;
            }
            .result-card {
                padding: 16px;
            }
            .stats-drawer {
                width: 100%;
                max-width: 100vw;
                right: -100%;
            }
        }
        @media (max-width: 425px) {
            .message {
                max-width: 98%;
            }
            .message-bubble {
                padding: 8px 10px;
                font-size: 0.78rem;
            }
            .message-avatar {
                width: 26px;
                height: 26px;
                font-size: 0.75rem;
            }
            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }
            .welcome-desc {
                font-size: 0.72rem;
            }
            .input-container textarea {
                font-size: 0.78rem;
            }
            .btn-icon .tooltip {
                display: none;
            }
            .option-btn {
                padding: 8px 10px;
                font-size: 0.75rem;
            }
            .nav-dot {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
        }
        @media (min-width: 1920px) {
            .messages-container {
                padding: 30px 40px;
            }
            .message {
                max-width: 70%;
            }
            .input-area {
                padding: 14px 40px 18px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
        button:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
            <div class="sidebar-header">
                <div class="sidebar-logo"><span class="logo-icon">🧠</span><span class="logo-text">QuizGen AI</span></div>
                <div class="sidebar-subtitle">Smart Quiz Generator</div>
            </div>
            <div class="sidebar-actions">
                <button class="btn-new-quiz" id="btnNewQuiz" title="Create a new quiz"><span>+</span> New Quiz</button>
            </div>
            <nav class="sidebar-nav" aria-label="Quiz navigation">
                <button class="sidebar-nav-btn active" data-nav="history" id="navHistory"><span>💬</span> Quiz History</button>
                <button class="sidebar-nav-btn" data-nav="saved" id="navSaved"><span>📁</span> Saved Quizzes</button>
                <button class="sidebar-nav-btn" data-nav="stats" id="navStats"><span>📊</span> Statistics</button>
                <button class="sidebar-nav-btn" data-nav="settings" id="navSettings"><span>⚙️</span> Settings</button>
            </nav>
            <div class="sidebar-history" id="sidebarHistory">
                <div class="history-label">Today</div>
                <div id="historyToday"></div>
                <div class="history-label" id="yesterdayLabel" style="display:none;">Yesterday</div>
                <div id="historyYesterday"></div>
                <div class="history-label" id="olderLabel" style="display:none;">Older</div>
                <div id="historyOlder"></div>
            </div>
            <div class="sidebar-footer">
                <span class="streak-badge" id="streakBadge">🔥 0 Day Streak</span>
                <button class="sidebar-footer-btn" id="btnClearHistory" title="Clear all history"><span>🗑️</span> Clear History</button>
                <button class="sidebar-footer-btn" id="btnThemeToggle" title="Toggle dark/light mode"><span>🌙</span> Theme Toggle</button>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main-chat" id="mainChat">
            <header class="chat-header">
                <div class="chat-header-left">
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle sidebar">☰</button>
                    <div>
                        <div class="chat-header-title">QuizGen AI</div>
                        <div class="chat-header-subtitle"><span class="status-dot"></span><span>● Ready</span></div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="btn-icon" id="btnHeaderNew" title="New Quiz"><span>＋</span><span class="tooltip">New Quiz</span></button>

            // ============================================================
            // QUIZ ENGINE
            // ============================================================
            function generateQuiz(subject, difficulty, questionCount, mode, timerEnabled) {
                let filteredQuestions = questionBank.filter(q =>
                    q.subject.toLowerCase() === subject.toLowerCase() &&
                    (difficulty === 'any' || q.difficulty === difficulty)
                );

                if (filteredQuestions.length === 0) {
                    filteredQuestions = questionBank.filter(q => q.subject.toLowerCase() === subject.toLowerCase());
                }

                if (filteredQuestions.length === 0) {
                    filteredQuestions = [...questionBank];
                }

                const actualCount = Math.min(questionCount, filteredQuestions.length);
                const shuffled = shuffleArray(filteredQuestions);
                const selected = shuffled.slice(0, actualCount);

                // Randomize answer options but preserve correct answer
                const finalQuestions = selected.map(q => {
                    const options = [...q.options];
                    const correctAnswer = q.options[q.answer];
                    const shuffledOptions = shuffleArray(options);
                    const newAnswerIndex = shuffledOptions.indexOf(correctAnswer);
                    return {
                        ...q,
                        options: shuffledOptions,
                        answer: newAnswerIndex,
                        originalAnswer: q.answer,
                    };
                });

                return {
                    id: 'quiz_' + Date.now(),
                    subject,
                    difficulty,
                    mode: mode || 'exam',
                    timerEnabled: timerEnabled !== undefined ? timerEnabled : true,
                    questions: finalQuestions,
                    currentIndex: 0,
                    answers: new Array(finalQuestions.length).fill(null),
                    markedForReview: new Array(finalQuestions.length).fill(false),
                    startTime: Date.now(),
                    endTime: null,
                    totalTime: finalQuestions.length * 60,
                    status: 'active',
                };
            }

            function shuffleArray(arr) {
                const newArr = [...arr];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            }

            function detectSubject(text) {
                const lower = text.toLowerCase();
                const subjectMap = {
                    'dsa': 'DSA',
                    'data structure': 'DSA',
                    'data structures': 'DSA',
                    'algorithm': 'DSA',
                    'algorithms': 'DSA',
                    'java': 'Java',
                    'javascript': 'JavaScript',
                    'js': 'JavaScript',
                    'react': 'React',
                    'mern': 'MERN',
                    'html': 'HTML',
                    'css': 'CSS',
                    'node': 'Node.js',
                    'nodejs': 'Node.js',
                    'node.js': 'Node.js',
                    'mongodb': 'MongoDB',
                    'mongo': 'MongoDB',
                    'express': 'Express',
                    'aptitude': 'Aptitude',
                    'reasoning': 'Logical Reasoning',
                    'logical': 'Logical Reasoning',
                    'dbms': 'DBMS',
                    'sql': 'SQL',
                    'database': 'DBMS',
                    'operating system': 'Operating Systems',
                    'os': 'Operating Systems',
                    'computer network': 'Computer Networks',
                    'cn': 'Computer Networks',
                    'networks': 'Computer Networks',
                    'oop': 'OOP',
                    'object oriented': 'OOP',
                    'computer fundamentals': 'Computer Fundamentals',
                    'placement': 'Placement',
                };
                for (const [key, value] of Object.entries(subjectMap)) {
                    if (lower.includes(key)) return value;
                }
                return null;
            }

            function detectDifficulty(text) {
                const lower = text.toLowerCase();
                if (/\b(easy|beginner|simple|basic)\b/i.test(lower)) return 'easy';
                if (/\b(hard|difficult|advanced|tough|challenging)\b/i.test(lower)) return 'hard';
                if (/\b(medium|intermediate|moderate)\b/i.test(lower)) return 'medium';
                return null;
            }

            function detectQuestionCount(text) {
                const lower = text.toLowerCase();
                const match = lower.match(/(\d+)\s*(?:-|\s)?(?:question|questions|quiz|q)/i);
                if (match) {
                    const num = parseInt(match[1]);
                    if (num >= 5 && num <= 20) return Math.min(Math.max(num, 5), 20);
                    if (num > 20) return 20;
                    if (num < 5) return 5;
                }
                const numMatch = lower.match(/\b(5|10|15|20)\b/);
                if (numMatch) return parseInt(numMatch[1]);
                return null;
            }

            function detectQuizMode(text) {
                const lower = text.toLowerCase();
                if (/\b(exam|test)\b/i.test(lower)) return 'exam';
                if (/\b(practice|learn)\b/i.test(lower)) return 'practice';
                if (/\b(instant|feedback|immediate)\b/i.test(lower)) return 'instant';
                return null;
            }

            function parseQuizRequest(text) {
                const subject = detectSubject(text);
                const difficulty = detectDifficulty(text) || state.settings.defaultDifficulty || 'medium';
                const questionCount = detectQuestionCount(text) || state.settings.defaultCount || 10;
                const mode = detectQuizMode(text) || 'exam';
                return { subject, difficulty, questionCount, mode };
            }

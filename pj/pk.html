              <div class="quiz-header-row">
                <div>
                  <div class="quiz-title">${quiz.subject} Quiz - ${quiz.difficulty.charAt(0).toUpperCase() + quiz.difficulty.slice(1)}</div>
                  <div class="quiz-meta">
                    <span>Question ${quiz.currentIndex + 1} of ${quiz.questions.length}</span>
                    <span>Mode: ${quiz.mode.charAt(0).toUpperCase() + quiz.mode.slice(1)}</span>
                  </div>
                </div>
                ${quiz.timerEnabled ? `<div class="quiz-timer" id="quizTimer">${formatTime(quiz.totalTime)}</div>` : ''}
              </div>
              <div class="quiz-progress-bar">
                <div class="quiz-progress-fill" style="width: ${progress}%"></div>
              </div>
              <div class="question-card">
                <div class="question-progress-text">
                  <span>Question ${quiz.currentIndex + 1}/${quiz.questions.length}</span>
                  <span>${quiz.answers[quiz.currentIndex] !== null ? 'Answered' : 'Not answered'}</span>
                </div>
                <div class="question-text">${q.question}</div>
                <div class="options-container" id="optionsContainer">
              `;

                q.options.forEach((opt, idx) => {
                    const isSelected = quiz.answers[quiz.currentIndex] === idx;
                    const isInstantMode = quiz.mode === 'instant';
                    let optionClass = 'option-btn';
                    if (isSelected) optionClass += ' selected';
                    if (isInstantMode && isSelected) {
                        optionClass += idx === q.answer ? ' correct' : ' wrong';
                    }
                    html += `
                <button class="${optionClass}" data-option-index="${idx}" onclick="selectOption(${idx})">
                  <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                  <span>${opt}</span>
                </button>
              `;
                });

                html += `</div>`;

                // Show explanation in instant feedback mode
                if (quiz.mode === 'instant' && quiz.answers[quiz.currentIndex] !== null) {
                    const isCorrect = quiz.answers[quiz.currentIndex] === q.answer;
                    html += `
                <div class="explanation-box ${isCorrect ? 'correct' : 'wrong'}">
                  <strong>${isCorrect ? '✓ Correct!' : '✗ Incorrect!'}</strong><br>
                  ${q.explanation}
                </div>
              `;
                }

                // Show explanation in practice mode
                if (quiz.mode === 'practice' && quiz.answers[quiz.currentIndex] !== null) {
                    const isCorrect = quiz.answers[quiz.currentIndex] === q.answer;
                    html += `
                <div class="explanation-box ${isCorrect ? 'correct' : 'wrong'}">
                  <strong>${isCorrect ? '✓ Correct!' : '✗ Incorrect!'}</strong><br>
                  ${q.explanation}
                </div>
              `;
                }

                html += `</div>`;

                html += `<div class="quiz-nav-buttons">`;
                html +=
                    `<button class="btn btn-secondary" onclick="prevQuestion()" ${quiz.currentIndex === 0 ? 'disabled' : ''}>← Previous</button>`;
                html +=
                    `<button class="btn btn-outline" onclick="toggleMarkReview()">${quiz.markedForReview[quiz.currentIndex] ? '★ Marked' : '☆ Mark for Review'}</button>`;
                if (quiz.currentIndex < quiz.questions.length - 1) {
                    html += `<button class="btn btn-primary" onclick="nextQuestion()">Next →</button>`;
                } else {
                    html += `<button class="btn btn-success" onclick="submitQuiz()">Submit Quiz</button>`;
                }
                html += `</div>`;

                // Question navigator
                html += `<div class="question-navigator">`;
                quiz.questions.forEach((_, idx) => {
                    let dotClass = 'nav-dot';
                    if (idx === quiz.currentIndex) dotClass += ' current';
                    if (quiz.answers[idx] !== null) dotClass += ' answered';
                    if (quiz.markedForReview[idx]) dotClass += ' review';
                    if (quiz.answers[idx] !== null && quiz.markedForReview[idx]) dotClass += ' answered-review';
                    html += `<button class="${dotClass}" onclick="gotoQuestion(${idx})">${idx + 1}</button>`;
                });
                html += `</div>`;

                quizInterface.innerHTML = html;

                // Start timer if enabled
                if (quiz.timerEnabled && !quiz.timerInterval) {
                    startQuizTimer();
                }
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function startQuizTimer() {
                const quiz = state.currentQuiz;
                if (!quiz || !quiz.timerEnabled) return;
                quiz.timerInterval = setInterval(() => {
                    if (quiz.totalTime <= 0) {
                        clearInterval(quiz.timerInterval);
                        quiz.timerInterval = null;
                        submitQuiz();
                        return;
                    }
                    quiz.totalTime--;
                    const timerEl = document.getElementById('quizTimer');
                    if (timerEl) {
                        timerEl.textContent = formatTime(quiz.totalTime);
                        if (quiz.totalTime < 30) {
                            timerEl.classList.add('low');
                        }
                    }
                }, 1000);
            }

            function selectOption(index) {
                const quiz = state.currentQuiz;
                if (!quiz || quiz.status === 'completed') return;
                quiz.answers[quiz.currentIndex] = index;

                if (quiz.mode === 'instant') {
                    const q = quiz.questions[quiz.currentIndex];
                    const isCorrect = index === q.answer;
                    renderQuizInterface();
                    showToast(isCorrect ? 'Correct answer!' : 'Incorrect answer', isCorrect ? 'success' : 'error');
                    // Auto-advance after a short delay
                    if (quiz.currentIndex < quiz.questions.length - 1) {
                        setTimeout(() => nextQuestion(), 1500);
                    }
                } else {
                    renderQuizInterface();
                }
            }

            function nextQuestion() {
                const quiz = state.currentQuiz;
                if (!quiz) return;
                if (quiz.currentIndex < quiz.questions.length - 1) {
                    quiz.currentIndex++;
                    renderQuizInterface();
                }
            }

            function prevQuestion() {
                const quiz = state.currentQuiz;
                if (!quiz) return;
                if (quiz.currentIndex > 0) {
                    quiz.currentIndex--;
                    renderQuizInterface();
                }
            }

            function gotoQuestion(index) {
                const quiz = state.currentQuiz;
                if (!quiz) return;
                if (index >= 0 && index < quiz.questions.length) {
                    quiz.currentIndex = index;
                    renderQuizInterface();
                }
            }

            function toggleMarkReview() {
                const quiz = state.currentQuiz;
                if (!quiz) return;
                quiz.markedForReview[quiz.currentIndex] = !quiz.markedForReview[quiz.currentIndex];
                renderQuizInterface();
            }

            function submitQuiz() {
                const quiz = state.currentQuiz;
                if (!quiz || quiz.status === 'completed') return;
                if (quiz.timerInterval) {
                    clearInterval(quiz.timerInterval);
                    quiz.timerInterval = null;
                }
                quiz.status = 'completed';
                quiz.endTime = Date.now();
                const timeTaken = Math.floor((quiz.endTime - quiz.startTime) / 1000);
                quiz.timeTaken = timeTaken;

                // Calculate score
                let correct = 0;
                let wrong = 0;
                let skipped = 0;
                quiz.questions.forEach((q, idx) => {
                    if (quiz.answers[idx] === null) {
                        skipped++;
                    } else if (quiz.answers[idx] === q.answer) {
                        correct++;
                    } else {
                        wrong++;
                    }
                });

                quiz.score = correct;
                quiz.totalQuestions = quiz.questions.length;
                quiz.correct = correct;
                quiz.wrong = wrong;
                quiz.skipped = skipped;
                quiz.percentage = Math.round((correct / quiz.questions.length) * 100);

                // Update statistics
                updateStatistics(quiz);

                // Save to history
                saveQuizToHistory(quiz);

                // Update streak
                updateStreak();

                renderResultScreen();
            }

            function renderResultScreen() {
                const quizInterface = document.getElementById('quizInterface');
                const resultScreen = document.getElementById('resultScreen');
                const messagesContainer = document.getElementById('messagesContainer');
                const inputArea = document.getElementById('inputArea');

                quizInterface.classList.remove('active');
                messagesContainer.style.display = 'none';
                inputArea.style.display = 'none';
                resultScreen.classList.add('active');

                const quiz = state.currentQuiz;
                const percentage = quiz.percentage;
                let performanceLevel = 'Keep Practicing';
                let performanceClass = 'performance-keep';
                let emoji = '💪';

                if (percentage >= 90) { performanceLevel = 'Excellent';
                    performanceClass = 'performance-excellent';
                    emoji = '🏆'; } else if (percentage >= 75) { performanceLevel = 'Very Good';
                    performanceClass = 'performance-good';
                    emoji = '🎉'; } else if (percentage >= 60) { performanceLevel = 'Good';
                    performanceClass = 'performance-good';
                    emoji = '👍'; } else if (percentage >= 40) { performanceLevel = 'Needs Improvement';
                    performanceClass = 'performance-improve';
                    emoji = '📚'; }

                const minutes = Math.floor(quiz.timeTaken / 60);
                const seconds = quiz.timeTaken % 60;
                const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                let html = `
              <div class="result-card">
                <div class="result-emoji">${emoji}</div>
                <h3>Quiz Completed!</h3>
                <div class="result-score">${quiz.correct} / ${quiz.totalQuestions}</div>
                <div class="result-percentage">${percentage}%</div>
                <span class="performance-label ${performanceClass}">${performanceLevel}</span>
                <div class="result-stats">
                  <div class="stat-item"><div class="stat-value">${quiz.correct}</div><div class="stat-label">Correct</div></div>
                  <div class="stat-item"><div class="stat-value">${quiz.wrong}</div><div class="stat-label">Wrong</div></div>
                  <div class="stat-item"><div class="stat-value">${quiz.skipped}</div><div class="stat-label">Skipped</div></div>
                  <div class="stat-item"><div class="stat-value">${timeStr}</div><div class="stat-label">Time</div></div>
                </div>
              </div>
              ${renderWeakTopics(quiz)}
              <div class="result-review">
                <h3 style="text-align:center;">📝 Question Review</h3>
                ${quiz.questions.map((q, idx) => {
                  const userAnswer = quiz.answers[idx];
                  const isCorrect = userAnswer === q.answer;
                  const isSkipped = userAnswer === null;
                  let cardClass = 'correct';
                  let answerText = '';
                  if (isSkipped) { cardClass = 'skipped'; answerText = 'Skipped'; }
                  else if (isCorrect) { answerText = 'Correct'; }
                  else { cardClass = 'wrong'; answerText = 'Incorrect'; }
                  return `
                    <div class="review-card ${cardClass}">
                      <div class="review-question">Q${idx+1}: ${q.question}</div>
                      <div class="review-answer">
                        Your answer: ${isSkipped ? 'Not answered' : q.options[userAnswer]}<br>
                        Correct answer: <span class="correct-text">${q.options[q.answer]}</span>
                        ${!isCorrect && !isSkipped ? `<br><span class="wrong-text">(Your answer was incorrect)</span>` : ''}
                        <br><small style="color:var(--text-muted)">💡 ${q.explanation}</small>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
              <div class="result-actions">
                <button class="btn btn-primary" onclick="retryQuiz()">🔄 Retry Quiz</button>
                <button class="btn btn-secondary" onclick="generateNewQuiz()">📝 Generate New Quiz</button>
                <button class="btn btn-outline" onclick="practiceWeakTopics()">🎯 Practice Weak Topics</button>
                <button class="btn btn-outline" onclick="backToChat()">💬 Back to Chat</button>
              </div>
            `;

                resultScreen.innerHTML = html;
                state.currentQuiz = null;
            }

            function renderWeakTopics(quiz) {
                const topicAccuracy = {};
                quiz.questions.forEach((q, idx) => {
                    const key = `${q.subject} - ${q.topic}`;
                    if (!topicAccuracy[key]) {
                        topicAccuracy[key] = { correct: 0, total: 0 };
                    }
                    topicAccuracy[key].total++;
                    if (quiz.answers[idx] === q.answer) {
                        topicAccuracy[key].correct++;
                    }
                });

                const weakTopics = Object.entries(topicAccuracy)
                    .filter(([_, v]) => v.total > 0 && (v.correct / v.total) < 0.7)
                    .sort((a, b) => (a[1].correct / a[1].total) - (b[1].correct / b[1].total));

                if (weakTopics.length === 0) {
                    return `<div class="weak-topics"><h4>🎯 Strong Performance!</h4><p>You did great across all topics. Keep it up!</p></div>`;
                }

                let html = `<div class="weak-topics"><h4>📚 Recommended Practice Areas:</h4>`;
                weakTopics.slice(0, 5).forEach(([topic, data]) => {
                    const pct = Math.round((data.correct / data.total) * 100);
                    html +=
                        `<div class="weak-topic-item"><span>${topic}</span><span style="color:var(--danger)">${pct}%</span></div>`;
                });
                html += `</div>`;
                return html;
            }

            function retryQuiz() {
                if (state.lastQuizParams) {
                    startQuiz(state.lastQuizParams.subject, state.lastQuizParams.difficulty, state.lastQuizParams
                        .questionCount, state.lastQuizParams.mode);
                } else {
                    backToChat();
                }
            }

            function generateNewQuiz() {
                backToChat();
                const input = document.getElementById('chatInput');
                if (input) {
                    input.value = 'Create a new quiz';
                    input.focus();
                }
            }

            function practiceWeakTopics() {
                backToChat();
                const input = document.getElementById('chatInput');
                if (input) {
                    input.value = 'Practice my weak topics';
                    input.focus();
                }
            }

            function backToChat() {
                const quizInterface = document.getElementById('quizInterface');
                const resultScreen = document.getElementById('resultScreen');
                const messagesContainer = document.getElementById('messagesContainer');
                const inputArea = document.getElementById('inputArea');
                quizInterface.classList.remove('active');
                resultScreen.classList.remove('active');
                messagesContainer.style.display = 'flex';
                inputArea.style.display = 'block';
                renderChatMessages();
            }

            function startQuiz(subject, difficulty, questionCount, mode, timerEnabled) {
                const quiz = generateQuiz(subject, difficulty, questionCount, mode, timerEnabled);
                state.currentQuiz = quiz;
                state.lastQuizParams = { subject, difficulty, questionCount, mode, timerEnabled };
                renderQuizInterface();
                showToast(`Quiz generated: ${subject} (${questionCount} questions)`, 'success');
            }

            // ============================================================
            // CHATBOT ENGINE
            // ============================================================
            function generateChatbotResponse(text) {
                const lower = text.toLowerCase().trim();

                // Help request
                if (/\b(help|how.*work|what.*do|topics|subjects)\b/i.test(lower) && !detectSubject(lower)) {
                    return {
                        message: `I can generate quizzes on the following subjects:

                <ul>
                  ${SUBJECTS.map(s => `<li>${s}</li>`).join('')}
                </ul>
                <p>Just tell me what you want, like:</p>
                <ul>
                  <li>"Create 10 Java questions"</li>
                  <li>"Give me a DSA quiz"</li>
                  <li>"Make an easy JavaScript test"</li>
                  <li>"Generate 20 medium aptitude questions"</li>
                </ul>
                <p>You can also specify the difficulty (easy, medium, hard) and the number of questions (5, 10, 15, 20).</p>`,
                        action: null
                    };
                }

                // About the quiz engine
                if (/\b(how.*quiz.*work|explain.*quiz|quiz.*mode|practice.*mode|exam.*mode)\b/i.test(lower) && !
                    detectSubject(lower)) {
                    return {
                        message: `Here's how the quiz works:

                <h4>📝 Quiz Modes:</h4>
                <ul>
                  <li><strong>Exam Mode</strong> – Answers revealed only after submission</li>
                  <li><strong>Practice Mode</strong> – See explanations after each answer</li>
                  <li><strong>Instant Feedback</strong> – Immediate feedback after each selection</li>
                </ul>
                <h4>⏱️ Timer:</h4>
                <ul>
                  <li>5 questions → 5 minutes</li>
                  <li>10 questions → 10 minutes</li>
                  <li>15 questions → 15 minutes</li>
                  <li>20 questions → 20 minutes</li>
                </ul>
                <h4>🎯 Features:</h4>
                <ul>
                  <li>Question navigator to jump between questions</li>
                  <li>Mark questions for review</li>
                  <li>Detailed results with explanations</li>
                  <li>Weak topic detection and recommendations</li>
                </ul>
                <p>Try saying "Create a Java quiz" or "Give me 10 medium DSA questions"!</p>`,
                        action: null
                    };
                }

                // Custom quiz builder
                if (/\b(custom|builder|create.*custom|manual)\b/i.test(lower) && /\b(quiz|test)\b/i.test(lower)) {
                    openCustomQuizModal();
                    return {
                        message: `I've opened the <strong>Custom Quiz Builder</strong> where you can choose subject, topic, difficulty, question count, mode, and timer settings.`,
                        action: null
                    };
                }

                // Start quiz request
                const parsed = parseQuizRequest(text);
                if (parsed.subject) {
                    const subject = parsed.subject;
                    const difficulty = parsed.difficulty || 'medium';
                    const count = parsed.questionCount || 10;
                    const mode = parsed.mode || 'exam';
                    const timerEnabled = state.settings.timerEnabled !== false;

                    return {
                        message: `Great! I've created a <strong>${count}-question ${subject} quiz</strong> at <strong>${difficulty}</strong> difficulty in <strong>${mode}</strong> mode. Good luck! 🎯`,
                        action: { type: 'startQuiz', subject, difficulty, count, mode, timerEnabled }
                    };
                }

                // Default response
                return {
                    message: `I'm here to help you generate quizzes! Try saying:

                <ul>
                  <li>📊 "Create a DSA quiz"</li>
                  <li>☕ "Give me 10 Java questions"</li>
                  <li>📜 "Make an easy JavaScript test"</li>
                  <li>🚀 "Generate a MERN stack quiz"</li>
                  <li>📐 "Give me 20 aptitude questions"</li>
                  <li>🗄️ "Test me on DBMS"</li>
                </ul>
                <p>Or type <strong>"help"</strong> to see all available subjects and features.</p>`,
                    action: null
                };
            }

            // ============================================================
            // CHAT UI
            // ============================================================
            function renderChatMessages() {
                const container = document.getElementById('messagesContainer');
                if (!container) return;
                if (state.chatMessages.length === 0) {
                    renderWelcomeScreen(container);
                    return;
                }
                container.innerHTML = '';
                state.chatMessages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.role}`;
                    const avatar = msg.role === 'ai' ? '🧠' : '👤';
                    div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                  <div class="message-bubble">${msg.content}</div>
                  <div class="msg-timestamp">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</div>
                </div>
              `;
                    container.appendChild(div);
                });
                scrollToBottom();
            }

            function renderWelcomeScreen(container) {
                container.innerHTML = `
              <div class="welcome-screen">
                <div class="welcome-emoji">👋</div>
                <h2 class="welcome-title">Hi, I'm QuizGen AI</h2>
                <p class="welcome-subtitle">Your personal quiz generator.</p>
                <p class="welcome-desc">Tell me any subject, difficulty and number of questions, and I'll create a quiz for you.</p>
                <div class="quick-actions">
                  <button class="quick-action-card" data-subject="DSA"><span class="qa-icon">📊</span>DSA Quiz</button>
                  <button class="quick-action-card" data-subject="Java"><span class="qa-icon">☕</span>Java Quiz</button>
                  <button class="quick-action-card" data-subject="JavaScript"><span class="qa-icon">📜</span>JavaScript Quiz</button>
                  <button class="quick-action-card" data-subject="MERN"><span class="qa-icon">🚀</span>MERN Quiz</button>
                  <button class="quick-action-card" data-subject="Aptitude"><span class="qa-icon">📐</span>Aptitude Quiz</button>
                  <button class="quick-action-card" data-subject="DBMS"><span class="qa-icon">🗄️</span>DBMS Quiz</button>
                  <button class="quick-action-card" data-subject="Operating Systems"><span class="qa-icon">💻</span>OS Quiz</button>
                  <button class="quick-action-card" data-subject="Computer Networks"><span class="qa-icon">🌐</span>Networks Quiz</button>
                  <button class="quick-action-card" data-subject="OOP"><span class="qa-icon">🧩</span>OOP Quiz</button>
                  <button class="quick-action-card" data-subject="Placement"><span class="qa-icon">🎯</span>Placement Quiz</button>
                </div>
              </div>
            `;
                container.querySelectorAll('.quick-action-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const subject = card.getAttribute('data-subject');
                        handleUserMessage(`Create a 10 question ${subject} quiz`);
                    });
                });
            }

            function scrollToBottom() {
                const container = document.getElementById('messagesContainer');
                if (container) container.scrollTop = container.scrollHeight;
            }

            function showTypingIndicator() {
                const container = document.getElementById('messagesContainer');
                if (!container) return;
                const existing = container.querySelector('.typing-message');
                if (existing) existing.remove();
                const typingDiv = document.createElement('div');
                typingDiv.className = 'message ai typing-message';
                typingDiv.innerHTML = `
              <div class="message-avatar">🧠</div>
              <div>
                <div class="message-bubble">
                  <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                  </div>
                </div>
              </div>
            `;
                container.appendChild(typingDiv);
                scrollToBottom();
            }

            function removeTypingIndicator() {
                const container = document.getElementById('messagesContainer');
                if (!container) return;
                const typing = container.querySelector('.typing-message');
                if (typing) typing.remove();
            }

            function handleUserMessage(text) {
                const trimmed = text.trim();
                if (!trimmed || state.isTyping) return;
                state.chatMessages.push({ role: 'user', content: trimmed, timestamp: Date.now() });
                renderChatMessages();
                state.isTyping = true;
                showTypingIndicator();

                const delay = 400 + Math.random() * 400;
                setTimeout(() => {
                    const response = generateChatbotResponse(trimmed);
                    state.chatMessages.push({ role: 'ai', content: response.message, timestamp: Date.now() });
                    state.isTyping = false;
                    removeTypingIndicator();
                    renderChatMessages();
                    if (response.action && response.action.type === 'startQuiz') {
                        const a = response.action;
                        startQuiz(a.subject, a.difficulty, a.count, a.mode, a.timerEnabled);
                    }
                }, delay);
            }

            // ============================================================
            // STORAGE SYSTEM
            // ============================================================
            function saveData(key, data) {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) { /* localStorage unavailable */ }
            }

            function getData(key, defaultValue) {
                try {
                    const saved = localStorage.getItem(key);
                    if (saved) return JSON.parse(saved);
                } catch (e) { /* ignore */ }
                return defaultValue;
            }

            function removeData(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) { /* ignore */ }
            }

            function clearData() {
                Object.values(STORAGE_KEYS).forEach(key => {
                    try {
                        localStorage.removeItem(key);
                    } catch (e) { /* ignore */ }
                });
            }

            function saveQuizToHistory(quiz) {
                const historyItem = {
                    id: quiz.id,
                    title: `${quiz.subject} Quiz - ${quiz.difficulty}`,
                    subject: quiz.subject,
                    difficulty: quiz.difficulty,
                    score: quiz.correct,
                    total: quiz.totalQuestions,
                    percentage: quiz.percentage,
                    date: Date.now(),
                };
                state.quizHistory.unshift(historyItem);
                if (state.quizHistory.length > 100) state.quizHistory = state.quizHistory.slice(0, 100);
                saveData(STORAGE_KEYS.history, state.quizHistory);
                renderHistory();
            }

            function updateStatistics(quiz) {
                const stats = state.statistics;
                stats.totalQuizzes++;
                stats.questionsAttempted += quiz.totalQuestions;
                stats.totalCorrect += quiz.correct;
                stats.totalWrong += quiz.wrong;
                stats.bestScore = Math.max(stats.bestScore, quiz.percentage);

                const key = quiz.subject;
                if (!stats.subjectPerformance[key]) {
                    stats.subjectPerformance[key] = { correct: 0, total: 0 };
                }
                stats.subjectPerformance[key].correct += quiz.correct;
                stats.subjectPerformance[key].total += quiz.totalQuestions;

                saveData(STORAGE_KEYS.statistics, stats);
            }

            function updateStreak() {
                const today = new Date().toDateString();
                if (state.streak.lastUpdate !== today) {
                    const yesterday = new Date(Date.now() - 86400000).toDateString();
                    if (state.streak.lastUpdate === yesterday) {
                        state.streak.count++;
                    } else {
                        state.streak.count = 1;
                    }
                    state.streak.lastUpdate = today;
                }
                saveData(STORAGE_KEYS.streak, state.streak);
                updateStreakDisplay();
            }

            function updateStreakDisplay() {
                const badge = document.getElementById('streakBadge');
                if (badge) badge.textContent = `🔥 ${state.streak.count} Day Streak`;
            }

            function loadAllData() {
                state.theme = getData(STORAGE_KEYS.theme, 'dark');
                state.quizHistory = getData(STORAGE_KEYS.history, []);
                state.savedQuizzes = getData(STORAGE_KEYS.savedQuizzes, []);
                state.statistics = getData(STORAGE_KEYS.statistics, {
                    totalQuizzes: 0,
                    questionsAttempted: 0,
                    totalCorrect: 0,
                    totalWrong: 0,
                    bestScore: 0,
                    subjectPerformance: {},
                });
                state.streak = getData(STORAGE_KEYS.streak, { count: 0, lastUpdate: null });
                state.settings = getData(STORAGE_KEYS.settings, { defaultDifficulty: 'medium', defaultCount: 10,
                    timerEnabled: true });
            }

            function renderHistory() {
                const todayEl = document.getElementById('historyToday');
                const yesterdayEl = document.getElementById('historyYesterday');
                const olderEl = document.getElementById('historyOlder');
                const yesterdayLabel = document.getElementById('yesterdayLabel');
                const olderLabel = document.getElementById('olderLabel');
                if (!todayEl || !yesterdayEl || !olderEl) return;

                todayEl.innerHTML = '';
                yesterdayEl.innerHTML = '';
                olderEl.innerHTML = '';
                yesterdayLabel.style.display = 'none';
                olderLabel.style.display = 'none';

                const now = new Date();
                const todayStr = now.toDateString();
                const yesterdayStr = new Date(now - 86400000).toDateString();

                state.quizHistory.forEach(item => {
                    const itemDate = new Date(item.date).toDateString();
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `
                <span class="history-icon">📊</span>
                <span class="history-title">${item.title}</span>
                <button class="history-delete" data-id="${item.id}">✕</button>
              `;
                    div.addEventListener('click', () => {
                        showToast(`Score: ${item.score}/${item.total} (${item.percentage}%)`, 'info');
                    });
                    div.querySelector('.history-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        state.quizHistory = state.quizHistory.filter(h => h.id !== item.id);
                        saveData(STORAGE_KEYS.history, state.quizHistory);
                        renderHistory();
                        showToast('Quiz deleted', 'info');
                    });

                    if (itemDate === todayStr) {
                        todayEl.appendChild(div);
                    } else if (itemDate === yesterdayStr) {
                        yesterdayLabel.style.display = 'block';
                        yesterdayEl.appendChild(div);
                    } else {
                        olderLabel.style.display = 'block';
                        olderEl.appendChild(div);
                    }
                });

                if (state.quizHistory.length === 0) {
                    todayEl.innerHTML =
                        '<p style="font-size:0.72rem;color:var(--text-muted);padding:6px;">No quizzes yet. Start a new one!</p>';
                }
            }

            // ============================================================
            // THEME MANAGEMENT
            // ============================================================
            function setTheme(theme) {
                state.theme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                saveData(STORAGE_KEYS.theme, theme);
                updateThemeButton();
            }

            function toggleTheme() {
                setTheme(state.theme === 'dark' ? 'light' : 'dark');
            }

            function updateThemeButton() {
                const btn = document.getElementById('btnThemeToggle');
                if (btn) {
                    btn.innerHTML = state.theme === 'dark' ?
                        '<span>☀️</span> Theme Toggle' :
                        '<span>🌙</span> Theme Toggle';
                }
            }

            // ============================================================
            // TOAST SYSTEM
            // ============================================================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
                container.appendChild(toast);
                setTimeout(() => {
                    if (toast.parentElement) toast.remove();
                }, 3000);
            }

            // ============================================================
            // CUSTOM QUIZ MODAL
            // ============================================================
            function openCustomQuizModal() {
                const overlay = document.getElementById('modalOverlay');
                const subjectSelect = document.getElementById('formSubject');
                const topicSelect = document.getElementById('formTopic');
                if (overlay && subjectSelect) {
                    subjectSelect.innerHTML = SUBJECTS.map(s =>
                        `<option value="${s}">${s}</option>`).join('');
                    topicSelect.innerHTML = '<option value="">All Topics</option>';
                    overlay.classList.add('active');
                }
            }

            function closeCustomQuizModal() {
                const overlay = document.getElementById('modalOverlay');
                if (overlay) overlay.classList.remove('active');
            }

            // ============================================================
            // STATISTICS DRAWER
            // ============================================================
            function openStatsDrawer() {
                const drawer = document.getElementById('statsDrawer');
                const body = document.getElementById('statsDrawerBody');
                if (!drawer || !body) return;
                const stats = state.statistics;
                const avgScore = stats.totalQuizzes > 0 ? Math.round((stats.totalCorrect / stats
                    .questionsAttempted) * 100) : 0;

                let html = `
              <div class="stats-grid">
                <div class="stats-card"><div class="stats-card-value">${stats.totalQuizzes}</div><div class="stats-card-label">Total Quizzes</div></div>
                <div class="stats-card"><div class="stats-card-value">${stats.questionsAttempted}</div><div class="stats-card-label">Questions Attempted</div></div>
                <div class="stats-card"><div class="stats-card-value">${avgScore}%</div><div class="stats-card-label">Average Score</div></div>
                <div class="stats-card"><div class="stats-card-value">${stats.bestScore}%</div><div class="stats-card-label">Best Score</div></div>
                <div class="stats-card"><div class="stats-card-value">${stats.totalCorrect}</div><div class="stats-card-label">Total Correct</div></div>
                <div class="stats-card"><div class="stats-card-value">${stats.totalWrong}</div><div class="stats-card-label">Total Wrong</div></div>
                <div class="stats-card"><div class="stats-card-value">🔥 ${state.streak.count}</div><div class="stats-card-label">Day Streak</div></div>
              </div>
              <h4 style="margin-top:10px;">📊 Subject Performance</h4>
              <div class="subject-performance">
            `;

                const subjects = Object.keys(stats.subjectPerformance);
                if (subjects.length === 0) {
                    html +=
                        '<p style="font-size:0.8rem;color:var(--text-muted)">No quiz data yet. Complete a quiz to see statistics!</p>';
                } else {
                    subjects.sort((a, b) => {
                        const pa = stats.subjectPerformance[a];
                        const pb = stats.subjectPerformance[b];
                        return (pb.correct / pb.total) - (pa.correct / pa.total);
                    });
                    subjects.forEach(subject => {
                        const perf = stats.subjectPerformance[subject];
                        const pct = perf.total > 0 ? Math.round((perf.correct / perf.total) * 100) : 0;
                        html += `
                  <div class="subject-bar-row">
                    <span class="subject-bar-label">${subject}</span>
                    <div class="subject-bar-track">
                      <div class="subject-bar-fill" style="width:${pct}%"></div>
                    </div>
                    <span class="subject-bar-percent">${pct}%</span>
                  </div>
                `;
                    });
                }

                html += `</div>`;
                body.innerHTML = html;
                drawer.classList.add('open');
            }

            function closeStatsDrawer() {
                const drawer = document.getElementById('statsDrawer');
                if (drawer) drawer.classList.remove('open');
            }

            // ============================================================
            // SIDEBAR
            // ============================================================
            function toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (!sidebar || !overlay) return;
                state.isSidebarOpen = !state.isSidebarOpen;
                sidebar.classList.toggle('open', state.isSidebarOpen);
                overlay.classList.toggle('active', state.isSidebarOpen);
            }

            function closeSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (!sidebar || !overlay) return;
                state.isSidebarOpen = false;
                sidebar.classList.remove('open');
                overlay.classList.remove('active');
            }

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            function initializeEvents() {
                // Send button
                document.getElementById('btnSend')?.addEventListener('click', () => {
                    const input = document.getElementById('chatInput');
                    if (input && input.value.trim()) {
                        const text = input.value.trim();
                        input.value = '';
                        updateCharCounter();
                        autoResizeTextarea();
                        handleUserMessage(text);
                    }
                });
                // New quiz buttons
                document.getElementById('btnNewQuiz')?.addEventListener('click', () => {
                    backToChat();
                    const input = document.getElementById('chatInput');
                    if (input) input.focus();
                });
                document.getElementById('btnHeaderNew')?.addEventListener('click', () => {
                    backToChat();
                    const input = document.getElementById('chatInput');
                    if (input) input.focus();
                });
                // Theme toggle
                document.getElementById('btnThemeToggle')?.addEventListener('click', toggleTheme);
                document.getElementById('btnHeaderTheme')?.addEventListener('click', toggleTheme);
                // Header stats
                document.getElementById('btnHeaderStats')?.addEventListener('click', openStatsDrawer);
                document.getElementById('btnHeaderSettings')?.addEventListener('click', () => {
                    openCustomQuizModal();
                });
                // Sidebar nav
                document.getElementById('navHistory')?.addEventListener('click', () => {
                    closeSidebar();
                    renderHistory();
                });
                document.getElementById('navSaved')?.addEventListener('click', () => {
                    closeSidebar();
                    showToast('Saved quizzes feature coming soon!', 'info');
                });
                document.getElementById('navStats')?.addEventListener('click', () => {
                    closeSidebar();
                    openStatsDrawer();
                });
                document.getElementById('navSettings')?.addEventListener('click', () => {
                    closeSidebar();
                    openCustomQuizModal();
                });
                // Clear history
                document.getElementById('btnClearHistory')?.addEventListener('click', () => {
                    if (confirm('Are you sure you want to clear all quiz history?')) {
                        state.quizHistory = [];
                        saveData(STORAGE_KEYS.history, state.quizHistory);
                        renderHistory();
                        showToast('History cleared', 'info');
                    }
                });
                // Hamburger
                document.getElementById('hamburgerBtn')?.addEventListener('click', toggleSidebar);
                document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);
                // Textarea
                const input = document.getElementById('chatInput');
                if (input) {
                    input.addEventListener('input', () => {
                        updateCharCounter();
                        autoResizeTextarea();
                    });
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            const btn = document.getElementById('btnSend');
                            btn?.click();
                        }
                    });
                }
                // Voice and attachment
                document.getElementById('btnVoice')?.addEventListener('click', () => {
                    showToast('Voice input is a UI demo feature', 'info');
                });
                document.getElementById('btnAttachment')?.addEventListener('click', () => {
                    showToast('Attachment is a UI demo feature', 'info');
                });
                // Modal
                document.getElementById('btnCloseModal')?.addEventListener('click', closeCustomQuizModal);
                document.getElementById('btnCancelModal')?.addEventListener('click', closeCustomQuizModal);
                document.getElementById('btnGenerateModal')?.addEventListener('click', () => {
                    const subject = document.getElementById('formSubject')?.value || 'DSA';
                    const difficulty = document.getElementById('formDifficulty')?.value || 'medium';
                    const count = parseInt(document.getElementById('formQuestionCount')?.value || '10');
                    const mode = document.getElementById('formMode')?.value || 'exam';
                    const timer = document.getElementById('formTimer')?.value || 'on';
                    closeCustomQuizModal();
                    startQuiz(subject, difficulty, count, mode, timer === 'on');
                });
                // Stats drawer close
                document.getElementById('btnCloseStats')?.addEventListener('click', closeStatsDrawer);
                // Escape key
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        closeSidebar();
                        closeCustomQuizModal();
                        closeStatsDrawer();
                    }
                });
                // Close modal on overlay click
                document.getElementById('modalOverlay')?.addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeCustomQuizModal();
                });
            }

            function updateCharCounter() {
                const input = document.getElementById('chatInput');
                const counter = document.getElementById('charCounter');
                if (input && counter) counter.textContent = `${input.value.length} / 500`;
            }

            function autoResizeTextarea() {
                const input = document.getElementById('chatInput');
                if (!input) return;
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 100) + 'px';
            }

            // ============================================================
            // INITIALIZATION
            // ============================================================
            function initApp() {
                loadAllData();
                document.documentElement.setAttribute('data-theme', state.theme);
                updateThemeButton();
                updateStreakDisplay();
                renderHistory();
                renderChatMessages();
                initializeEvents();
                updateCharCounter();
                console.log('✅ QuizGen AI initialized successfully!');
                console.log('📊 Total questions in bank:', questionBank.length);
                console.log('📚 Subjects:', SUBJECTS.length);
                console.log('💾 Quiz history entries:', state.quizHistory.length);
                console.log('🔥 Streak:', state.streak.count, 'days');
            }

            document.addEventListener('DOMContentLoaded', initApp);

            // Expose functions for inline onclick
            window.selectOption = selectOption;
            window.nextQuestion = nextQuestion;
            window.prevQuestion = prevQuestion;
            window.gotoQuestion = gotoQuestion;
            window.toggleMarkReview = toggleMarkReview;
            window.submitQuiz = submitQuiz;
            window.retryQuiz = retryQuiz;
            window.generateNewQuiz = generateNewQuiz;
            window.practiceWeakTopics = practiceWeakTopics;
            window.backToChat = backToChat;

        })();
    </script>
</body>
</html>

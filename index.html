<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizGen AI – Quiz Generator Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
            <div class="sidebar-header">
                <div class="sidebar-logo"><span class="logo-icon">🧠</span><span class="logo-text">QuizGen AI</span></div>
                <div class="sidebar-subtitle">Smart Quiz Generator</div>
            </div>
            <div class="sidebar-actions">
                <button class="btn-new-quiz" id="btnNewQuiz" title="Create a new quiz"><span>+</span> New Quiz</button>
            </div>
            <nav class="sidebar-nav" aria-label="Quiz navigation">
                <button class="sidebar-nav-btn active" data-nav="history" id="navHistory"><span>💬</span> Quiz History</button>
                <button class="sidebar-nav-btn" data-nav="saved" id="navSaved"><span>📁</span> Saved Quizzes</button>
                <button class="sidebar-nav-btn" data-nav="stats" id="navStats"><span>📊</span> Statistics</button>
                <button class="sidebar-nav-btn" data-nav="settings" id="navSettings"><span>⚙️</span> Settings</button>
            </nav>
            <div class="sidebar-history" id="sidebarHistory">
                <div class="history-label">Today</div>
                <div id="historyToday"></div>
                <div class="history-label" id="yesterdayLabel" style="display:none;">Yesterday</div>
                <div id="historyYesterday"></div>
                <div class="history-label" id="olderLabel" style="display:none;">Older</div>
                <div id="historyOlder"></div>
            </div>
            <div class="sidebar-footer">
                <span class="streak-badge" id="streakBadge">🔥 0 Day Streak</span>
                <button class="sidebar-footer-btn" id="btnClearHistory" title="Clear all history"><span>🗑️</span> Clear History</button>
                <button class="sidebar-footer-btn" id="btnThemeToggle" title="Toggle dark/light mode"><span>🌙</span> Theme Toggle</button>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main-chat" id="mainChat">
            <header class="chat-header">
                <div class="chat-header-left">
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle sidebar">☰</button>
                    <div>
                        <div class="chat-header-title">QuizGen AI</div>
                        <div class="chat-header-subtitle"><span class="status-dot"></span><span>● Ready</span></div>
                    </div>
                </div>
                <div class="chat-header-actions">
                    <button class="btn-icon" id="btnHeaderNew" title="New Quiz"><span>＋</span><span class="tooltip">New Quiz</span></button>
                    <button class="btn-icon" id="btnHeaderTheme" title="Toggle Theme"><span>🌓</span><span class="tooltip">Theme</span></button>
                    <button class="btn-icon" id="btnHeaderStats" title="Statistics"><span>📊</span><span class="tooltip">Statistics</span></button>
                    <button class="btn-icon" id="btnHeaderSettings" title="Settings"><span>⚙️</span><span class="tooltip">Settings</span></button>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer"></div>

            <!-- QUIZ INTERFACE -->
            <div class="quiz-interface" id="quizInterface"></div>

            <!-- RESULT SCREEN -->
            <div class="result-screen" id="resultScreen"></div>

            <div class="input-area" id="inputArea">
                <div class="input-container" id="inputContainer">
                    <button class="input-btn" id="btnVoice" title="Voice input (UI only)">🎤</button>
                    <button class="input-btn" id="btnAttachment" title="Attachment (UI only)">📎</button>
                    <textarea id="chatInput" rows="1" placeholder="Ask me to create a quiz..." maxlength="500"></textarea>
                    <button class="input-btn send-btn" id="btnSend" title="Send">➤</button>
                    <span class="char-counter" id="charCounter">0 / 500</span>
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="customQuizModal">
            <div class="modal-header">
                <span class="modal-title">⚙️ Custom Quiz Builder</span>
                <button class="modal-close" id="btnCloseModal">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Subject</label>
                    <select class="form-select" id="formSubject"></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Topic (optional)</label>
                    <select class="form-select" id="formTopic"><option value="">All Topics</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Difficulty</label>
                    <select class="form-select" id="formDifficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Number of Questions</label>
                    <select class="form-select" id="formQuestionCount"><option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quiz Mode</label>
                    <select class="form-select" id="formMode"><option value="exam" selected>Exam Mode</option><option value="practice">Practice Mode</option><option value="instant">Instant Feedback</option></select>
                </div>
                <div class="form-group">
                    <label class="form-label">Timer</label>
                    <select class="form-select" id="formTimer"><option value="on">On</option><option value="off">Off</option></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btnCancelModal">Cancel</button>
                <button class="btn btn-primary" id="btnGenerateModal">Generate Quiz</button>
            </div>
        </div>
    </div>

    <!-- STATS DRAWER -->
    <div class="stats-drawer" id="statsDrawer">
        <div class="stats-drawer-header">
            <span class="modal-title">📊 Statistics</span>
            <button class="modal-close" id="btnCloseStats">✕</button>
        </div>
        <div class="stats-drawer-body" id="statsDrawerBody"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
<script src="script.js"></script>
</body>
</html>
